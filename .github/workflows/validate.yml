name: Validate Scaffold

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run scaffold validation
        run: bash packages/project-prompt-kit/scripts/validate.sh
